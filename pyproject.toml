[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.build]
dev-mode-dirs = ["."]                  # editable install puts the repo root on sys.path -> `import backend.app` works everywhere

[project]
name = "teamdesk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.4.0",
    "pwdlib>=0.4.2",
]                      # everything lives in groups below

[dependency-groups]
backend = [
  "fastapi", "uvicorn[standard]", "pydantic-settings",
  "sqlalchemy[asyncio]>=2.0,<2.1", "psycopg[binary,pool]", "alembic",
  "argon2-cffi", "pyjwt", "logfire[fastapi,sqlalchemy,psycopg]",
]
frontend = ["streamlit", "httpx", "pydantic", "logfire"]
dev = ["pytest", "pytest-asyncio", "ruff"]
notebooks = ["jupyterlab", "ipykernel"]

[tool.uv]
package = true                         # editable install of the project so `backend.app` is importable (notebooks, scripts)
default-groups = ["backend", "frontend", "dev"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
