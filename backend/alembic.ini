[alembic]
script_location = %(here)s/alembic
# repo root on sys.path so `backend.app...` imports work inside env.py
prepend_sys_path = %(here)s/..
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# the database URL is NOT set here: env.py reads it from the app settings (.env / DATABASE_URL)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
